name: siesco-local
services:
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copie .env.example para .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Defina POSTGRES_APP_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portal"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/portal
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  seed:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://portal_app:${POSTGRES_APP_PASSWORD}@db:5432/portal
      ALLOW_DEMO_SEED: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Defina DEMO_PASSWORD}
    command: ["python", "-m", "app.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://portal_app:${POSTGRES_APP_PASSWORD}@db:5432/portal
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8000
      APP_ORIGIN: http://localhost:${WEB_PORT:-3100}
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3100"
    depends_on:
      api:
        condition: service_healthy
  test:
    build: ./apps/api
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+psycopg://portal_app:${POSTGRES_APP_PASSWORD}@db:5432/portal_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/portal_test
      TEST_DATABASE_ALLOWED: "true"
      ALLOW_DEMO_SEED: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    command: ["sh", "-c", "alembic upgrade head && pytest -q"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
